<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mathflow</title>
        <style>
            :root {
                font-family: system-ui, Avenir, Helvetica, Arial, sans-serif;
                line-height: 1.5;
                font-weight: 400;

                color-scheme: light dark;
                color: rgba(255, 255, 255, 0.87);
                background-color: #242424;

                font-synthesis: none;
                text-rendering: optimizeLegibility;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            @media (prefers-color-scheme: light) {
                :root {
                    color: #213547;
                    background-color: #ffffff;
                }
            }

            *,
            *::after,
            *::before {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                display: flex;
                place-items: center;
                min-width: 320px;
                min-height: 100vh;
            }

            main {
                width: 100%;
                max-width: 800px;
                margin: 0 auto;
                padding: 2rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            main > * {
                width: 100%;
            }

            textarea {
                width: 100%;
                min-height: 45dvh;
                padding: 1rem;
                resize: vertical;
                font-size: 1.1rem;
            }

            details,
            summary {
                cursor: default;
            }

            button {
                padding: 0.5rem 1rem;
                width: 50%;
                margin: 1rem auto;
            }

            #latex {
                padding: 0.5rem 0;
                overflow-x: auto;
            }

            #latex .katex-display {
                margin: 0.35rem 0;
                text-align: left;
            }

            #latex-source {
                font-size: 0.8rem;
                white-space: pre-wrap;
                word-break: break-all;
                opacity: 0.7;
                max-height: 30dvh;
                overflow: auto;
            }

            #error {
                display: none;
            }

            #error.active {
                display: block;
                padding: 1rem 0;
                color: rgb(243, 96, 96);
                border-radius: 15px;
            }
        </style>
    </head>

    <body>
        <main>
            <h1>Mathflow | Demo</h1>

            <div>
                <h3>Input math expression:</h3>
                <textarea
                    id="input"
                    autocapitalize="off"
                    autocorrect="off"
                    autofocus
                    spellcheck="false"
                ></textarea>
                <button id="solve">Solve</button>
            </div>

            <div>
                <h3>Solution:</h3>
                <div id="solution"></div>
            </div>

            <div>
                <h3>LaTeX:</h3>
                <div id="latex"></div>
                <details>
                    <summary>LaTeX source</summary>
                    <pre id="latex-source"></pre>
                </details>
            </div>

            <p id="error"></p>
        </main>

        <script type="module" src="./demo/main.ts"></script>
    </body>
</html>
